name: C++ backend

on:
  push:
    paths:
      - "cpp/**"
      - ".github/workflows/cpp-backend.yml"
  pull_request:
    paths:
      - "cpp/**"
      - ".github/workflows/cpp-backend.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
