name: C++ backend and Python integration

on:
  push:
    paths:
      - "cpp/**"
      - "src/axiom/neuroscience.py"
      - "src/axiom/native.py"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/cpp-backend.yml"
  pull_request:
    paths:
      - "cpp/**"
      - "src/axiom/neuroscience.py"
      - "src/axiom/native.py"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/cpp-backend.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Configure C++
        run: cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build C++
        run: cmake --build build --parallel
      - name: Test C++ kernel
        run: ctest --test-dir build --output-on-failure
      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Test Python package and native parity
        run: python -m pip install -e . && python -m pytest -q
        env:
          AXIOM_CPP_LIBRARY: ${{ github.workspace }}/build/libaxiom_cpp.so
