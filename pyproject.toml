
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-science"
version = "0.1.0"
description = "A readable experimental programming language for computational neuroscience."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
axiom = "axiom.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
